name: Upload Release

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Release even if this version already has a tag.'
        type: boolean
        default: false
      test:
        description: 'Test run. Builds everything but uploads nothing and creates no release or tag.'
        type: boolean
        default: false
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'conanfile.py'
      - 'version.txt'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Check whether this version is already released
        id: check
        shell: bash
        run: |
          # Only numbered versions are published. A version counts as released
          # once its tag exists, and tag-and-release creates the tag only after
          # the Conan upload and the release builds have succeeded.
          version="$(tr -d '[:space:]' < version.txt)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event.inputs.force }}" == "true" ]]; then
            echo "Forced release of $version"
            echo "release=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null; then
            echo "$version is already released; nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$version has no tag; releasing"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  conan-upload:
    if: github.repository == 'instinkt900/moth_editor' && needs.check-version.outputs.release == 'true'
    needs: check-version
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - os: windows
            runs_on: windows-2022
          - os: linux
            runs_on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Conan
      uses: conan-io/setup-conan@v1
      with:
        cache_packages: true

    - name: Allow Conan to install missing system packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo 'tools.system.package_manager:mode=install' >> "$(conan config home)/global.conf"
        echo 'tools.system.package_manager:sudo=True' >> "$(conan config home)/global.conf"

    - name: Build package
      shell: bash
      run: |
        conan remote add artifactory ${{ vars.ARTIFACTORY_URL }} --force
        conan remote login artifactory ${{ vars.ARTIFACTORY_USER }} -p ${{ secrets.ARTIFACTORY_TOKEN }}
        # --update on every Conan call in CI. This job restores a Conan cache
        # keyed only on the Conan version and the OS, so it survives every
        # dependency change. Conan resolves a version range against that cache
        # and never asks the remote whether something newer matches, which
        # silently pins an old version. See instinkt900/moth_editor#30.
        # MSVC's detected profile defaults to cppstd=14; the recipe requires 17.
        conan create . ${{ matrix.os == 'windows' && '-s compiler.cppstd=17' || '' }} -s build_type=Release --build=missing --update

    - name: Upload package
      if: github.event.inputs.test != 'true'
      shell: bash
      run: conan upload "moth_editor/${{ needs.check-version.outputs.version }}:*" --confirm --remote artifactory

  build-release:
    if: github.repository == 'instinkt900/moth_editor' && needs.check-version.outputs.release == 'true'
    needs: check-version
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - os: windows
            build_type: Release
            runs_on: windows-2022
            configure_preset: conan-default
            build_preset: conan-release
          - os: linux
            build_type: Release
            runs_on: ubuntu-latest
            configure_preset: conan-release
            build_preset: conan-release

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Conan
      uses: conan-io/setup-conan@v1
      with:
        cache_packages: true

    - name: Allow Conan to install missing system packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo 'tools.system.package_manager:mode=install' >> "$(conan config home)/global.conf"
        echo 'tools.system.package_manager:sudo=True' >> "$(conan config home)/global.conf"

    - name: Add remotes
      shell: bash
      run: |
        conan remote add artifactory ${{ vars.ARTIFACTORY_URL }} --force
        conan remote login artifactory ${{ vars.ARTIFACTORY_USER }} -p ${{ secrets.ARTIFACTORY_TOKEN }}

    - name: Configure and build
      shell: bash
      run: |
        # MSVC's detected profile defaults to cppstd=14; the recipe requires 17.
        conan install . ${{ matrix.os == 'windows' && '-s compiler.cppstd=17' || '' }} -s build_type=${{ matrix.build_type }} --build=missing --update
        cmake --preset ${{ matrix.configure_preset }}
        cmake --build --preset ${{ matrix.build_preset }} --config ${{ matrix.build_type }}

    - name: Install to staging directory
      if: matrix.os == 'linux'
      run: cmake --install build/${{ matrix.build_type }} --config ${{ matrix.build_type }} --prefix staging

    - name: Install to staging directory
      if: matrix.os == 'windows'
      run: cmake --install build --config ${{ matrix.build_type }} --prefix staging

    - name: Archive binaries (Linux)
      if: matrix.os == 'linux'
      run: |
        mv staging moth_editor-${{ needs.check-version.outputs.version }}
        tar czf moth_editor-${{ needs.check-version.outputs.version }}-linux-${{ matrix.build_type }}.tar.gz moth_editor-${{ needs.check-version.outputs.version }}

    - name: Archive binaries (Windows)
      if: matrix.os == 'windows'
      shell: pwsh
      run: |
        Rename-Item staging moth_editor-${{ needs.check-version.outputs.version }}
        Compress-Archive -Path moth_editor-${{ needs.check-version.outputs.version }} -DestinationPath moth_editor-${{ needs.check-version.outputs.version }}-windows-${{ matrix.build_type }}.zip

    - name: Upload archive as workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: moth_editor-${{ matrix.os }}-${{ matrix.build_type }}
        path: moth_editor-${{ needs.check-version.outputs.version }}-*
        retention-days: 1

  tag-and-release:
    if: github.repository == 'instinkt900/moth_editor' && needs.check-version.outputs.release == 'true' && github.event.inputs.test != 'true'
    needs: [check-version, conan-upload, build-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create version tag
        uses: rickstaa/action-create-tag@v1
        with:
          tag: ${{ needs.check-version.outputs.version }}
          tag_exists_error: false
          force_push_tag: true

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Generate CHANGELOG.md
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate release notes (current version only)
        id: release-notes
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --current --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit CHANGELOG.md to master
        run: |
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore(release): update CHANGELOG.md for ${{ needs.check-version.outputs.version }} [skip ci]"
          git fetch origin master
          git rebase origin/master || { echo "Rebase failed; aborting to avoid overwriting remote history"; git rebase --abort; exit 1; }
          git push origin master

      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          name: "moth_editor ${{ needs.check-version.outputs.version }}"
          body_path: RELEASE_NOTES.md
          files: release-assets/*
