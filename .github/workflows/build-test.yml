name: Build and Test

on:
  workflow_dispatch:
  # Tools take direct commits to the default branch as well as pull requests,
  # so both are built.
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'conanfile.py'
      - 'version.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'conanfile.py'
      - 'version.txt'
      - '.github/workflows/**'

jobs:
  build-test:
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - os: windows
            runs_on: windows-2022
            configure_preset: conan-default
          - os: linux
            runs_on: ubuntu-latest
            configure_preset: conan-release

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Conan
      uses: conan-io/setup-conan@v1
      with:
        cache_packages: true

    - name: Allow Conan to install missing system packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        echo 'tools.system.package_manager:mode=install' >> "$(conan config home)/global.conf"
        echo 'tools.system.package_manager:sudo=True' >> "$(conan config home)/global.conf"

    - name: Add private artifactory
      shell: bash
      run: |
        conan remote add artifactory ${{ vars.ARTIFACTORY_URL }} --force
        conan remote login artifactory ${{ vars.ARTIFACTORY_USER }} -p ${{ secrets.ARTIFACTORY_TOKEN }}

    - name: Configure and build
      shell: bash
      run: |
        # MSVC's detected profile defaults to cppstd=14; the recipe requires 17.
        conan install . ${{ matrix.os == 'windows' && '-s compiler.cppstd=17' || '' }} -s build_type=Release --build=missing --update
        cmake --preset ${{ matrix.configure_preset }}
        cmake --build --preset conan-release --config Release
