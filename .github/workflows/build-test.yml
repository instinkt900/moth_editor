name: Build and Test

on:
  workflow_dispatch:
  pull_request:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'CMakeLists.txt'
      - 'conanfile.py'
      - 'version.txt'
      - '.conan/**'
      - '.github/workflows/**'

jobs:
  build-test:
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - os: windows
            runs_on: windows-2022
            configure_preset: conan-default
          - os: linux
            runs_on: ubuntu-latest
            configure_preset: conan-release

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Conan
      uses: conan-io/setup-conan@v1
      with:
        cache_packages: true

    - name: Add private artifactory
      run: |
        conan remote add artifactory ${{ vars.ARTIFACTORY_URL }} --force
        conan remote login artifactory ci -p ${{ secrets.ARTIFACTS_TOKEN }}

    - name: Configure and build
      shell: bash
      run: |
        # --update, because this job restores a Conan cache. Conan resolves a
        # version range against the cache and does not ask the remote whether
        # something newer matches, so a cached moth_graphics/1.3.0 satisfied
        # [>=1.3 <2] and 1.3.1 was never seen. That reads as a dependency bug
        # and is a stale cache.
        conan install . -pr .conan/profile -s build_type=Release --build=missing --update
        cmake --preset ${{ matrix.configure_preset }}
        cmake --build --preset conan-release --config Release

